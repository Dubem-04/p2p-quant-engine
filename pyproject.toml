# ==============================================================================
# PYPROJECT.TOML: Project Metadata, Dependency Specification & Tool Configurations
# ==============================================================================
# PURPOSE & CONTRIBUTION:
#   Serves as the central declarative configuration file for the entire project.
#   Defines exact package dependencies, project versions, build systems, and
#   standardizes configuration for code linters, formatters, and testing suites.
# ==============================================================================

[project]
name = "p2p-quant-engine"
version = "0.1.0"
description = "Autonomous quantitative market-making and automated settlement framework for bilateral P2P liquidity."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Oputa Chidubem", email = "oputachidubem@gmail.com" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "httpx[http2]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.1",
    "python-Levenshtein>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
select = ["E", "F", "B", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]