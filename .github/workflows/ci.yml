name: CI Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          uv sync --all-extras

      - name: Check Code Formatting with Ruff
        run: |
          uv run ruff format --check .

      - name: Lint Code with Ruff
        run: |
          uv run ruff check .

      - name: Run Unit Tests
        run: |
          uv run pytest

  bump-version:
    needs: lint-and-test
    # Only run on direct pushes/merges to the staging branch
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Bump Version Natively based on Commit Message
        id: version_check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
            echo "Major change detected."
            uv project version major
            echo "should_push=true" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
            echo "Minor feature detected."
            uv project version minor
            echo "should_push=true" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"[patch]"* ]]; then
            echo "Patch fix detected."
            uv project version patch
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "No versioning keywords ([major], [minor], [patch]) found. Skipping version bump."
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push New Version
        if: steps.version_check.outputs.should_push == 'true'
        run: |
          git add pyproject.toml
          git commit -m "chore(release): bump version to $(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml) [skip ci]"
          git push origin staging
